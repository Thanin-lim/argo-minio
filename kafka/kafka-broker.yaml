apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-broker
  namespace: kafka
spec:
  replicas: 1  # You can increase this to more than 1 for replication
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      containers:
      - name: kafka-broker
        image: wurstmeister/kafka
        env:
        - name: KAFKA_BROKER_ID
          value: "1"
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: "zookeeper-service:2181"
        - name: KAFKA_LISTENERS
          value: "PLAINTEXT://0.0.0.0:9092"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "PLAINTEXT://192.168.1.12:30008"
        - name: KAFKA_MIN_INSYNC_REPLICAS
          value: "2"  # Ensure you have enough replicas to meet this requirement
        - name: KAFKA_REPLICA_LAG_TIME_MAX_MS
          value: "10000"
        - name: KAFKA_REPLICA_FETCH_MAX_BYTES
          value: "104857600"
        ports:
        - containerPort: 9092

---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: kafka
spec:
  ports:
    - port: 9092
      targetPort: 9092
      nodePort: 30008  # External access port
  selector:
    app: kafka-broker
  type: NodePort
